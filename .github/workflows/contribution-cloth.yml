name: Contribution cloth

on:
  schedule:
    - cron: "17 15 * * *"   # every day at 00:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/contribution_cloth.py"
      - ".github/workflows/contribution-cloth.yml"

permissions:
  contents: write

concurrency:
  group: contribution-cloth
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the cloth from the last year of contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/contribution_cloth.py "${{ github.repository_owner }}" assets
      - name: Commit if the picture changed
        run: |
          if git diff --quiet -- assets/contribution-cloth-*.svg; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-cloth-*.svg
          git commit -m "Update contribution cloth"
          git push
